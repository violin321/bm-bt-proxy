<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - BM-BT-Proxy 控制台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      color: #fff;
    }
    .logo-container {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.5rem auto;
      border-radius: 18px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    .form-control {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      background: rgba(15, 23, 42, 0.85);
      border-color: #818cf8;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
      color: #fff;
    }
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    .btn-login {
      background: var(--primary-gradient);
      border: none;
      padding: 0.75rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.5);
    }
    .btn-login:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center">
      <div class="logo-container">
        <i class="bi bi-magnet-fill fs-2 text-white"></i>
      </div>
      <h4 class="fw-bold mb-1">BM-BT-Proxy</h4>
      <p class="text-secondary small mb-4">Byte-Muse BT 多源聚合管理控制台</p>
    </div>

    <div id="alertBox" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-3">
        <label class="form-label text-secondary small fw-medium">管理账号</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-secondary" style="border-radius: 12px 0 0 12px;"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" placeholder="请输入管理员用户名" required style="border-radius: 0 12px 12px 0;">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label text-secondary small fw-medium">访问密码</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-secondary" style="border-radius: 12px 0 0 12px;"><i class="bi bi-key"></i></span>
          <input type="password" class="form-control" id="password" placeholder="请输入访问密码" required style="border-radius: 0 12px 12px 0;">
        </div>
      </div>
      <button type="submit" class="btn btn-login w-100 text-white" id="submitBtn">
        <i class="bi bi-box-arrow-in-right me-1"></i> 进入控制台
      </button>
    </form>
    
    <div class="text-center mt-4">
      <small class="text-secondary opacity-75">BM-BT-Proxy · 高性能异步多源聚合中继</small>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> 登录中...';
      alertBox.classList.add('d-none');

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await resp.json();
        if (resp.ok && data.status === 'ok') {
          window.location.href = '/';
        } else {
          alertBox.innerText = data.detail || '用户名或密码错误';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.innerText = '连接服务器失败: ' + err;
        alertBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> 进入控制台';
      }
    }
  </script>
</body>
</html>
