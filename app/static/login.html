<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>登录 · BM-BT-Proxy</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/theme.css" />
    <link rel="stylesheet" href="/static/dashboard.css" />
    <script src="/static/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-story" aria-label="BM-BT-Proxy">
        <a class="brand" href="/login"
          ><svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path
              d="M7 8v16M16 5v22M25 8v16"
              stroke="currentColor"
              stroke-width="4"
            />
            <path d="M7 16h18" stroke="currentColor" stroke-width="3" /></svg
          ><span>BM-BT<span class="brand-sub">PROXY CONSOLE</span></span></a
        >
        <div class="login-intro">
          <h1>连接多个来源。<br />理清每一次响应。</h1>
          <p>
            集中管理数据源，测试上游响应，<br />让 Byte-Muse
            从一个入口获取聚合结果。
          </p>
          <div
            class="connection-diagram"
            role="img"
            aria-label="多个上游数据源通过 BM-BT 聚合后接入 Byte-Muse"
          >
            <div class="diagram-inputs">
              <div class="diagram-source">
                <span class="status-dot"></span>上游数据源
              </div>
              <div class="diagram-source">
                <span class="status-dot"></span>上游数据源
              </div>
              <div class="diagram-source">
                <span class="status-dot"></span>上游数据源
              </div>
            </div>
            <svg
              class="diagram-lines"
              viewBox="0 0 46 129"
              preserveAspectRatio="none"
            >
              <path d="M0 9h15v55h31M0 64h46M0 120h15V64" />
            </svg>
            <div class="diagram-hub">BM-BT</div>
            <span class="diagram-output"></span
            ><span class="diagram-label">Byte<br />Muse</span>
          </div>
        </div>
        <div class="login-story-footer">
          <span>多源连接，一个入口。</span><span>BM-BT-Proxy</span>
        </div>
      </section>
      <section class="login-form-area" aria-labelledby="loginHeading">
        <div class="login-form-wrap">
          <div class="login-mobile-brand">
            <div class="brand">
              <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <path
                  d="M7 8v16M16 5v22M25 8v16"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path
                  d="M7 16h18"
                  stroke="currentColor"
                  stroke-width="3"
                /></svg
              ><span>BM-BT<span class="brand-sub">PROXY CONSOLE</span></span>
            </div>
          </div>
          <h2 id="loginHeading">登录工作空间</h2>
          <p class="muted">管理连接，从这里继续。</p>
          <form id="loginForm" class="login-form">
            <label class="field" for="username"
              >管理账号<input
                id="username"
                name="username"
                autocomplete="username"
                placeholder="输入管理员用户名"
                required
                autofocus /></label
            ><label class="field" for="password"
              >访问密码<span class="password-wrap"
                ><input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="输入访问密码"
                  required /><button
                  id="showPassword"
                  type="button"
                  class="icon-btn"
                  aria-label="显示密码"
                  aria-pressed="false"
                >
                  <svg viewBox="0 0 24 24">
                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg></button></span
            ></label>
            <div id="loginError" class="notice error" role="alert" hidden></div>
            <button id="loginBtn" class="btn primary" type="submit">
              <span>进入控制台</span
              ><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
            </button>
          </form>
          <p class="login-subtext">
            使用服务中配置的管理员账号登录。<br />登录后可管理数据源、搜索测试与接口保护。
          </p>
        </div>
        <div class="login-bottom">BM-BT-Proxy · Byte-Muse 聚合中继</div>
      </section>
    </main>
  </body>
</html>
